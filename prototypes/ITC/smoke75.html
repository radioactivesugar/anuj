<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cigarette taxation vs. other markets</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles/globals.css" />
    <link rel="stylesheet" href="styles/smoke75.css" />

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  </head>
  <body>

    <section class="QW4K75-chart-section">
      <div class="QW4K75-chart-frame">
        <div class="QW4K75-chart-container">
          <div class="QW4K75-header-grid">
            <div class="QW4K75-title-group">
              <h1 class="QW4K75-chart-title">India taxes cigarettes far more heavily than other major markets</h1>
              <p class="QW4K75-chart-subtitle">Tax per 2000 Cigarettes as a % of Per Capita GDP</p>
            </div>
            <!-- Header Legend Node -->
            <div class="QW4K75-legend"><span class="QW4K75-legend-cig"></span>Tax rate (%)</div>
          </div>

          <!-- ECharts DOM element -->
          <div id="QW4K75-main-chart"></div>

          <div class="QW4K75-footer-note">Tax data &ndash; WHO Global Health Observatory</div>
        </div>
      </div>
    </section>

    <script src="scripts/smoke75.js"></script>
  </body>
</html>
