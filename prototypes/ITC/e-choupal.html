<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Choupal — ITC Mandi Price Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 15px;
      display: flex;
      justify-content: center;
      background-color: #3b6ea5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

/* styles/mandiMap.css — QW4K2 */

.QW4K2-mandi-section, .QW4K2-mandi-section *{box-sizing:border-box}

/* Retro "desktop" backdrop behind the window — replaces the original page-level <body> styling
   so the retro look stays scoped to this section instead of overriding the whole page. */
.QW4K2-mandi-section{
  --win-bg:#d4d0c8; --win-edge-light:#fff; --win-edge-shadow:#808080;
  --choupal-yellow:#fdf5c9; --choupal-yellow-2:#e2daaa; --choupal-green:#006600;
  --choupal-green-dk:#003300;
  /*background-color:#3b6ea5;*/
  font-family:"MS Sans Serif",Tahoma,Arial,sans-serif;
  font-size:13px; padding:10px;
  position:relative;
  overflow:hidden;
  width:100%;
}
.QW4K2-mandi-section.QW4K2-dither-effect::after{
  content:" ";display:block;position:absolute;top:0;left:0;bottom:0;right:0;
  background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.08) 50%),
    linear-gradient(90deg,rgba(255,0,0,.02),rgba(0,255,0,.01),rgba(0,0,255,.02));
  background-size:100% 3px,3px 100%;z-index:9999;pointer-events:none;
}
.QW4K2-window{
  background:var(--win-bg);border:2px solid;
  border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
  box-shadow:1px 1px 0 0 #000;padding:2px;max-width:1200px;margin:0 auto;
}
.QW4K2-title-bar{
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:4px 6px;
  display:flex;justify-content:space-between;align-items:center;font-weight:bold;
}
.QW4K2-window-controls button{
  background:var(--win-bg);border:1px solid;
  border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
  font-weight:bold;font-size:10px;padding:1px 4px;cursor:pointer;
}
.QW4K2-menu-bar{display:flex;justify-content:space-between;align-items:center;padding:4px;
  border-bottom:1px solid var(--win-edge-shadow);}
.QW4K2-left-menus span{margin-right:12px;cursor:pointer;}
.QW4K2-lang-select-box{font-size:11px;background:#fff;border:1px solid var(--win-edge-shadow);
  padding:1px 2px;font-weight:bold;}
.QW4K2-address-bar{display:flex;align-items:center;gap:5px;padding:4px;background:var(--win-bg);
  border-bottom:2px solid var(--win-edge-shadow);}
.QW4K2-address-input{flex-grow:1;background:#fff;border:2px solid;
  border-color:var(--win-edge-shadow) var(--win-edge-light) var(--win-edge-light) var(--win-edge-shadow);
  padding:2px 4px;font-family:monospace;}
.QW4K2-choupal-header{background-color:var(--choupal-yellow);border-bottom:3px solid var(--choupal-green);}
.QW4K2-ticker{background-color:var(--choupal-green);color:#fff;font-weight:bold;padding:4px;
  overflow:hidden;white-space:nowrap;}
.QW4K2-brand-main{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;}
.QW4K2-logo-placeholder{font-size:11px;font-weight:bold;line-height:1.2;color:var(--choupal-green-dk);}
.QW4K2-choupal-title{font-size:32px;font-weight:bold;color:var(--choupal-green);text-shadow:1px 1px 0 #000;}
.QW4K2-crop-nav{background:var(--choupal-yellow-2);padding:6px;text-align:center;
  border-top:1px solid var(--win-edge-shadow);border-bottom:1px solid var(--win-edge-shadow);font-weight:bold;}
.QW4K2-crop-nav a{color:#002266;text-decoration:none;margin:0 8px;cursor:pointer;}
.QW4K2-crop-nav a.QW4K2-selected-crop{color:red;border-bottom:2px solid red;}

/* dismissed the first time any crop is picked, from either panel — see
   selectCrop() in mandiMap.js */
.QW4K2-crop-hint{font-size:11px;font-style:italic;color:var(--choupal-green-dk);text-align:center;}
#QW4K2-crop-hint-top{background:var(--choupal-yellow-2);padding:2px 6px 4px;}
#QW4K2-crop-hint-left{text-align:left;margin-bottom:6px;}

.QW4K2-workspace{display:flex;background:#fff;height:640px;overflow:hidden;}

/* LEFT SIDEBAR = commodities (styled to match e-Choupal reference) */
.QW4K2-sidebar{width:210px;flex:0 0 210px;background-color:var(--choupal-yellow);
  border-right:2px solid var(--choupal-green);padding:10px;font-weight:bold;
  display:flex;flex-direction:column;height:100%;overflow:hidden;}
.QW4K2-sidebar-title{color:brown;font-size:16px;margin-bottom:6px;padding-bottom:2px;}
.QW4K2-state-select{margin-bottom:10px;font-weight:bold;color:#000;font-size:12px;}
.QW4K2-state-select select{font-size:12px;background:#fff;border:1px solid var(--win-edge-shadow);
  padding:1px 2px;font-weight:bold;font-family:inherit;}
.QW4K2-commodity-list{list-style:none;padding:0;margin:0 0 12px;overflow-y:auto;}
.QW4K2-commodity-list li{margin-bottom:8px;}
.QW4K2-commodity-list button{
  width:100%;text-align:left;font-family:inherit;font-size:15px;font-weight:bold;
  background:transparent;border:1px solid transparent;padding:1px 2px;cursor:pointer;
  color:var(--choupal-green);display:flex;align-items:center;gap:5px;line-height:1.1;
}
.QW4K2-commodity-list button:hover{color:#004400;text-decoration:underline;}
/* leaf/flame bullet before every item */
.QW4K2-commodity-list button::before{content:"✽";color:#c85000;font-size:12px;flex:0 0 auto;}
/* selected item: red text in an inset box, like the reference */
.QW4K2-commodity-list button.QW4K2-active{
  color:#cc0000;background:var(--choupal-yellow);
  border:1px solid var(--win-edge-shadow);
  box-shadow:inset 1px 1px 0 var(--win-edge-shadow);padding:2px 3px;
}
.QW4K2-commodity-list button.QW4K2-active::before{color:#cc0000;}
.QW4K2-commodity-list .QW4K2-cnt{display:none;}
.QW4K2-commodity-list li.QW4K2-all-item{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid brown;}

.QW4K2-side-note{margin-top:auto;font-size:10px;font-weight:normal;color:#665;
  border-top:1px solid var(--win-edge-shadow);padding-top:6px;line-height:1.35;}
.QW4K2-side-code{font-size:12px;font-weight:bold;color:var(--choupal-green);margin-top:8px;
  cursor:pointer;border-top:1px solid var(--win-edge-shadow);padding-top:8px;}
.QW4K2-side-code:hover{text-decoration:underline;}

/* CENTER = map hero (fixed to the workspace frame, independent of sidebar) */
.QW4K2-content-area{flex:1 1 auto;padding:12px;display:flex;flex-direction:column;gap:10px;
  min-width:0;height:100%;overflow:hidden;}
.QW4K2-desc{flex:0 0 auto;}
.QW4K2-desc b{color:var(--choupal-green-dk);}
.QW4K2-map-frame{flex:1 1 auto;border:2px inset var(--win-edge-shadow);background:#dcd2b8;padding:4px;
  display:flex;flex-direction:column;min-height:0;position:relative;}

/* default placeholder shown before any district is hovered — matches the
   real per-district popup's own styling (.QW4K2-pop-h/-sub/-rule) so it
   reads as "this is where that popup will appear". Hidden/shown by the
   mouseover/mouseout handlers in mandiMap.js. */
.QW4K2-map-hint{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:var(--win-bg);
  border:1px solid var(--win-edge-shadow);
  padding:8px 12px;
  font-family:monospace;
  font-size:12px;
  text-align:center;
  pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  z-index:999;
}
.QW4K2-map-hint-cta{margin-top:4px;font-weight:bold;color:var(--choupal-green);}
.QW4K2-map-caption{flex:0 0 auto;font-family:monospace;font-size:11px;font-weight:bold;color:#000;
  background:var(--win-bg);border:1px solid var(--win-edge-shadow);padding:3px 6px;margin-bottom:4px;
  display:flex;justify-content:space-between;align-items:center;}
#QW4K2-map{flex:1 1 auto;width:100%;background:#dcd2b8;min-height:0;}

.QW4K2-table-wrap{flex:0 0 auto;height:150px;overflow-y:scroll;border:2px inset var(--win-edge-shadow);background:#fff;}
.QW4K2-mandi-table{width:100%;border-collapse:collapse;}
.QW4K2-mandi-table th,.QW4K2-mandi-table td{border:1px solid #808080;padding:5px;font-size:12px;text-align:left;}
.QW4K2-mandi-table th{background-color:var(--win-bg);position:sticky;top:0;}
.QW4K2-highlight-row{background-color:#e2f0d9;font-weight:bold;}

/* Windows-98 style scrollbars to match the chrome — scoped to this module's own
   internal scrolling elements only (never the page/body scrollbar). */
.QW4K2-commodity-list, .QW4K2-table-wrap, .QW4K2-mandi-section .leaflet-popup-content{
  scrollbar-width:auto;
  scrollbar-color:var(--win-bg) #b8b4ac;
}
.QW4K2-commodity-list::-webkit-scrollbar,
.QW4K2-table-wrap::-webkit-scrollbar,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar{
  width:16px;height:16px;
}
.QW4K2-commodity-list::-webkit-scrollbar-track,
.QW4K2-table-wrap::-webkit-scrollbar-track,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-track{
  background-color:#b8b4ac;
  background-image:linear-gradient(45deg,#c8c4bc 25%,transparent 25%,transparent 75%,#c8c4bc 75%),
    linear-gradient(45deg,#c8c4bc 25%,transparent 25%,transparent 75%,#c8c4bc 75%);
  background-size:2px 2px;background-position:0 0,1px 1px;
}
.QW4K2-commodity-list::-webkit-scrollbar-thumb,
.QW4K2-table-wrap::-webkit-scrollbar-thumb,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-thumb{
  background:var(--win-bg);
  border:2px solid;
  border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
}
.QW4K2-commodity-list::-webkit-scrollbar-thumb:active,
.QW4K2-table-wrap::-webkit-scrollbar-thumb:active,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-thumb:active{
  border-color:var(--win-edge-shadow) var(--win-edge-light) var(--win-edge-light) var(--win-edge-shadow);
}
/* the little end buttons */
.QW4K2-commodity-list::-webkit-scrollbar-button,
.QW4K2-table-wrap::-webkit-scrollbar-button,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-button{
  background:var(--win-bg);
  border:2px solid;
  border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
  width:16px;height:16px;
  display:block;
}
.QW4K2-commodity-list::-webkit-scrollbar-button:active,
.QW4K2-table-wrap::-webkit-scrollbar-button:active,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-button:active{
  border-color:var(--win-edge-shadow) var(--win-edge-light) var(--win-edge-light) var(--win-edge-shadow);
}
.QW4K2-commodity-list::-webkit-scrollbar-corner,
.QW4K2-table-wrap::-webkit-scrollbar-corner,
.QW4K2-mandi-section .leaflet-popup-content::-webkit-scrollbar-corner{ background:var(--win-bg); }

/* Leaflet skin to match — .leaflet-* classes belong to the Leaflet library's own
   DOM and must stay unprefixed. Scoped under .QW4K2-mandi-section so it only
   affects this module's map instance, not any other Leaflet map on the page. */
.QW4K2-mandi-section .leaflet-container{font-family:"MS Sans Serif",Tahoma,sans-serif;background:#dcd2b8;}
.QW4K2-mandi-section .leaflet-popup-content-wrapper{border-radius:0;background:var(--win-bg);
  border:2px solid;border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
  box-shadow:1px 1px 0 #000;}
.QW4K2-mandi-section .leaflet-popup-content{margin:8px 10px;font-size:12px;}
.QW4K2-mandi-section .leaflet-popup-tip{background:var(--win-bg);}
.QW4K2-pop-h{font-weight:bold;color:var(--choupal-green);font-size:13px;}
.QW4K2-pop-sub{font-family:monospace;font-size:10px;color:#555;}
.QW4K2-pop-rule{border:none;border-top:1px solid var(--win-edge-shadow);margin:4px 0;}
.QW4K2-dlabel{background:transparent;border:none;box-shadow:none;font-family:monospace;font-size:10px;
  color:#000;font-weight:bold;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;padding:0;}
.QW4K2-dlabel::before{display:none;}
.QW4K2-map-legend{background:var(--win-bg);border:2px solid;
  border-color:var(--win-edge-light) var(--win-edge-shadow) var(--win-edge-shadow) var(--win-edge-light);
  padding:6px 8px;font-size:11px;line-height:1.5;font-weight:bold;color:#000;}
.QW4K2-map-legend .QW4K2-sw{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:middle;
  border:1px solid #555;}
@media(max-width:820px){
  .QW4K2-workspace{flex-direction:column;height:auto;overflow:visible;}
  .QW4K2-sidebar{width:100%;flex:0 0 auto;height:auto;overflow:visible;
    border-right:none;border-bottom:2px solid var(--choupal-green);}
  .QW4K2-commodity-list{max-height:200px;}
  .QW4K2-content-area{height:auto;overflow:visible;}
  .QW4K2-map-frame{height:440px;flex:0 0 auto;}
}

/* Mobile only: keep both the commodity list and the price table (Mandi
   Terminal + rates) capped and internally scrollable — letting either
   expand to full height instead ate up too much vertical space on phones. */
@media(max-width:768px){
  .QW4K2-commodity-list{max-height:110px;overflow-y:auto;}
  .QW4K2-table-wrap{height:120px;overflow-y:auto;}

  /* the full 4-line placeholder (district/sub/rule/CTA) is sized for the
     much wider desktop map — on a narrow mobile map it was covering too
     much of the visible area. Trim it down to 2 lines here, but keep it
     anchored to the same top spot as desktop (see base rule above). */
  .QW4K2-map-hint{
    max-width:90%;
    padding:4px 10px;
  }
  .QW4K2-map-hint .QW4K2-pop-sub,
  .QW4K2-map-hint .QW4K2-pop-rule{display:none;}
  .QW4K2-map-hint .QW4K2-pop-h{font-size:11px;}
  .QW4K2-map-hint-cta{margin-top:2px;font-size:11px;}
}
  </style>
</head>
<body>

        <section class="QW4K2-mandi-section QW4K2-dither-effect">
          <div class="QW4K2-window">
            <div class="QW4K2-title-bar">
              <div class="QW4K2-title-text" id="QW4K2-win-title">e-Choupal : Harnessing technology for the Indian farmer...</div>
              <div class="QW4K2-window-controls"><button>_</button><button>&#9633;</button><button>X</button></div>
            </div>

            <div class="QW4K2-menu-bar">
              <div class="QW4K2-left-menus"><span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Help</span></div>
              <div>
                <span style="font-weight:bold;font-size:11px;">Language / &#2349;&#2366;&#2359;&#2366;: </span>
                <select class="QW4K2-lang-select-box" id="QW4K2-langToggle">
                  <option value="en" selected>English</option>
                  <option value="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368; (Hindi)</option>
                </select>
              </div>
            </div>

            <div class="QW4K2-choupal-header">
              <div class="QW4K2-ticker"><marquee scrollamount="3" id="QW4K2-marquee-ticker"></marquee></div>
              <div class="QW4K2-brand-main">
                <div class="QW4K2-logo-placeholder">ITC Limited<br>Agri Business</div>
                <div class="QW4K2-choupal-title" id="QW4K2-brand-title">&#2312;-&#2330;&#2380;&#2346;&#2366;&#2354;</div>
                <div style="font-size:24px;">&#127806;&#128187;</div>
              </div>
              <div class="QW4K2-crop-nav" id="QW4K2-crop-links"></div>
              <div class="QW4K2-crop-hint" id="QW4K2-crop-hint-top">Select a crop above too</div>
            </div>

            <div class="QW4K2-workspace">
              <!-- LEFT SIDEBAR : COMMODITIES -->
              <div class="QW4K2-sidebar">
                <div class="QW4K2-sidebar-title" id="QW4K2-side-title"></div>
                <div class="QW4K2-state-select">
                  <span id="QW4K2-state-label"></span>
                  <select id="QW4K2-stateSel">
                    <option value="Madhya Pradesh" selected>Madhya Pradesh</option>
                  </select>
                </div>
                <div class="QW4K2-crop-hint" id="QW4K2-crop-hint-left">Select a crop from this list too</div>
                <ul class="QW4K2-commodity-list" id="QW4K2-commodity-list"></ul>
                <div class="QW4K2-side-code" id="QW4K2-side-code"></div>
                <div class="QW4K2-side-note" id="QW4K2-side-note"></div>
              </div>

              <!-- CENTER : MAP HERO -->
              <div class="QW4K2-content-area">
                <div class="QW4K2-desc"><b id="QW4K2-desc-text"></b></div>
                <div class="QW4K2-map-frame">
                  <div class="QW4K2-map-caption">
                    <span id="QW4K2-map-title"></span>
                    <span id="QW4K2-map-stat"></span>
                  </div>
                  <div id="QW4K2-map"></div>
                  <div id="QW4K2-map-hint" class="QW4K2-map-hint">
                    <div class="QW4K2-pop-h">Select a district</div>
                    <div class="QW4K2-pop-sub">Modal price will appear here</div>
                    <hr class="QW4K2-pop-rule">
                    <div class="QW4K2-map-hint-cta">Click the map to interact</div>
                  </div>
                </div>
                <div class="QW4K2-table-wrap">
                  <table class="QW4K2-mandi-table">
                    <thead><tr id="QW4K2-table-headers"></tr></thead>
                    <tbody id="QW4K2-table-body"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    descAll:"प्रत्येक जिले में दर्ज फसलों की संख्या का मध्य प्रदेश नक्शा:",
    th1:"मंडी क्षेत्र", th2:"जिला", th3:"फसल", th5:"सरकारी मंडी भाव",
    cropsel:"फसल:", low:"निम्न", high:"उच्च", markets:"मंडियां",
    norate:"कोई भाव नहीं", nrec:"कोई दर्ज नहीं",
    admin:"एडमिन विकल्प", stateLbl:"वरीयता:", code:"प्रवेश कोड बदलिये" },
  en:{ title:"e-Choupal was revolutionary for farmers. This is a re-imagined representation of its website.",
    brand:"e-Choupal", side:"Commodities",
    desc:"District-wise Madhya Pradesh map of modal mandi price for the selected commodity:",
    descAll:"District-wise Madhya Pradesh map of how many commodities each district recorded:",
    th1:"Mandi Terminal", th2:"District", th3:"Commodity", th5:"Govt Mandi Rate",
    cropsel:"Crop:", low:"Low", high:"High", markets:"markets",
    norate:"No rate", nrec:"No record",
    admin:"2026 Prices", stateLbl:"Priority:", code:"Change access code" }
};
let lang="en", currentCrop=ALL;

// ---- Leaflet map ----
// Zoom is locked (see setMinZoom/setMaxZoom below, once bounds are known) — panning
// within the padded MP bounds still works, but users can't zoom in/out at all.
const map=L.map("QW4K2-map",{
  scrollWheelZoom:false,
  doubleClickZoom:false,
  touchZoom:false,
  boxZoom:false,
  keyboard:false,
  zoomControl:false,
  // on mobile the map sits inside a page that's already meant to scroll
  // vertically — a draggable map there just fights that scroll gesture
  dragging: window.innerWidth > 768
});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,
  attribution:"© OpenStreetMap contributors"}).addTo(map);

// placeholder hint: tied to the map container as a whole (not each district
// layer's own mouseover/mouseout) — per-district toggling flickered the hint
// back on for an instant every time the cursor crossed from one district
// into an adjacent one, since there's a brief gap between one layer's
// mouseout and the next one's mouseover. Hiding/showing once, on actually
// entering/leaving the whole map, avoids that.
(function(){
  var hint=document.getElementById("QW4K2-map-hint");
  if(!hint) return;
  var container=map.getContainer();
  container.addEventListener("mouseenter",function(){ hint.style.display="none"; });
  container.addEventListener("mouseleave",function(){ hint.style.display=""; });
})();

// choupal-yellow -> choupal-green sequential ramp
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function rampColor(t){ // t in [0,1]
  // #eeddab -> #b3a25d -> #006600 (matches prototype visualMap)
  var stops=[[238,221,171],[179,162,93],[0,102,0]];
  if(t<=0) return "rgb("+stops[0].join(",")+")";
  if(t>=1) return "rgb("+stops[2].join(",")+")";
  var seg=t*2, i=Math.min(1,Math.floor(seg)), f=seg-i;
  var c0=stops[i], c1=stops[i+1];
  return "rgb("+lerp(c0[0],c1[0],f)+","+lerp(c0[1],c1[1],f)+","+lerp(c0[2],c1[2],f)+")";
}

var geoLayer=null, labelLayer=L.layerGroup().addTo(map), mpBounds=null;
var lastLo=null, lastHi=null;

// modal price per district for a crop (max across that district's markets)
function priceByDistrict(crop){
  var rows=byCommodity[crop]||[], m={};
  rows.forEach(function(r){ if(!(r.district in m)||r.modal>m[r.district]) m[r.district]=r.modal; });
  return m;
}
// distinct-commodity count per district (for ALL mode)
function countByDistrict(){
  var m={};
  RAW.forEach(function(r){ (m[r.district]=m[r.district]||new Set()).add(r.commodity); });
  var out={}; Object.keys(m).forEach(function(k){ out[k]=m[k].size; });
  return out;
}

function popupHtml(dist,rows,isAll){
  var sub = isAll ? (localizeNum(rows.length)+" "+(lang==="hi"?"फसलें":"commodities")) : cropLabel(currentCrop);
  var h='<div class="QW4K2-pop-h">'+distLabel(dist)+'</div><div class="QW4K2-pop-sub">'+sub+'</div><hr class="QW4K2-pop-rule">';
  rows.forEach(function(r){
    var name = isAll ? "<b>"+cropLabel(r.commodity)+"</b> " : "<b>"+marketLabel(r.market)+"</b><br>";
    h+='<div style="margin:2px 0">'+name+'<span style="font-family:monospace">'+fmt(r.modal)+
       '</span> <span style="color:#555">('+(isAll?marketLabel(r.market):r.variety)+')</span></div>';
  });
  return h;
}

function render(){
  var d=dict[lang];
  var isAll=(currentCrop===ALL);

  // choose the value each district is shaded by
  var valMap, lo, hi;
  if(isAll){ valMap=countByDistrict(); }
  else{ valMap=priceByDistrict(currentCrop); }
  var vals=Object.keys(valMap).map(function(k){return valMap[k];});
  lo=Math.min.apply(null,vals); hi=Math.max.apply(null,vals);
  if(!isFinite(lo)){lo=0;hi=1;}
  var span=(hi-lo)||1;
  lastLo=lo; lastHi=hi;

  if(geoLayer) map.removeLayer(geoLayer);
  labelLayer.clearLayers();

  geoLayer=L.geoJSON(MP_GEO,{
    style:function(feat){
      var dist=feat.properties.district;
      if(dist in valMap){
        var t=(valMap[dist]-lo)/span;
        return {fillColor:rampColor(t),fillOpacity:.85,color:"#556",weight:1};
      }
      return {fillColor:"#f3f0e0",fillOpacity:.45,color:"#a08a5c",weight:.6,dashArray:"2,3"};
    },
    onEachFeature:function(feat,lyr){
      var dist=feat.properties.district;
      if(!(dist in valMap)) return;
      var drows = isAll ? RAW.filter(function(r){return r.district===dist;})
                        : (byCommodity[currentCrop]||[]).filter(function(r){return r.district===dist;});
      lyr.bindPopup(popupHtml(dist,drows,isAll),{closeButton:false});
      lyr.on("mouseover",function(){lyr.setStyle({weight:2.6,color:"#ffcc00"});lyr.openPopup();lyr.bringToFront();});
      lyr.on("mouseout",function(){geoLayer.resetStyle(lyr);});
      try{
        var mk=L.marker(lyr.getBounds().getCenter(),
          {icon:L.divIcon({className:"QW4K2-dlabel",html:distLabel(dist),iconSize:null}),interactive:false});
        labelLayer.addLayer(mk);
      }catch(e){}
    }
  }).addTo(map);
  geoLayer.bringToBack();

  if(!mpBounds){ mpBounds=geoLayer.getBounds(); map.fitBounds(mpBounds,{padding:[12,12]});
    map.setMaxBounds(mpBounds.pad(0.25));
    var lockedZoom=map.getBoundsZoom(mpBounds);
    map.setMinZoom(lockedZoom); map.setMaxZoom(lockedZoom); }

  // description
  document.getElementById("QW4K2-desc-text").textContent = isAll ? d.descAll : d.desc;

  // caption + stat
  var mapPrefix = lang==="hi" ? "म.प्र. मंडी मानचित्र — " : "MP Mandi Map — ";
  document.getElementById("QW4K2-map-title").textContent = mapPrefix + cropLabel(currentCrop);
  var districtCount = Object.keys(valMap).length;
  // Hindi nouns here don't inflect for count the way English does, so the
  // singular/plural split only applies to the English labels
  var districtsWord = lang==="hi" ? "जिले" : pluralize(districtCount,"district","districts");
  var cropsWord = lang==="hi" ? "फसलें" : pluralize(hi,"crop","crops");
  var marketsWord = lang==="hi" ? d.markets : pluralize(districtCount,"market","markets");
  document.getElementById("QW4K2-map-stat").textContent = isAll
    ? (localizeNum(districtCount)+" "+districtsWord+" · "+localizeNum(lo)+"–"+localizeNum(hi)+" "+cropsWord)
    : (localizeNum(districtCount)+" "+marketsWord+" · "+fmtRange(lo,hi));

  // table
  var tbody=document.getElementById("QW4K2-table-body"); tbody.innerHTML="";
  if(isAll){
    document.getElementById("QW4K2-table-headers").innerHTML=
      "<th>"+d.th1+"</th><th>"+d.th2+"</th><th>"+d.th3+"</th><th>"+d.th5+"</th>";
    RAW.forEach(function(r){
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+marketLabel(r.market)+"</td><td>"+distLabel(r.district)+"</td><td>"+cropLabel(r.commodity)+
        "</td><td class='QW4K2-highlight-row'>"+fmt(r.modal)+"</td>";
      tbody.appendChild(tr);
    });
  }else{
    document.getElementById("QW4K2-table-headers").innerHTML=
      "<th>"+d.th1+"</th><th>"+d.th2+"</th><th>"+d.th5+"</th>";
    (byCommodity[currentCrop]||[]).forEach(function(r){
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+marketLabel(r.market)+"</td><td>"+distLabel(r.district)+
        "</td><td class='QW4K2-highlight-row'>"+fmt(r.modal)+"</td>";
      tbody.appendChild(tr);
    });
  }

  // sidebar active state
  document.querySelectorAll("#QW4K2-commodity-list button").forEach(function(b){
    b.classList.toggle("QW4K2-active", b.dataset.crop===currentCrop);
    var lbl=b.querySelector(".QW4K2-clabel"); if(lbl) lbl.textContent=cropLabel(b.dataset.crop);
  });

  // crop-nav quick links (All + first few)
  var quick=[ALL].concat(commodityOrder.slice(0,6));
  document.getElementById("QW4K2-crop-links").innerHTML="<span>"+d.cropsel+"</span> "+
    quick.map(function(c){
      return "<a class='"+(c===currentCrop?"QW4K2-selected-crop":"")+"' data-crop=\""+c+"\">"+cropLabel(c)+"</a>";
    }).join(" | ");
  document.querySelectorAll("#QW4K2-crop-links a").forEach(function(a){
    a.addEventListener("click",function(){selectCrop(a.dataset.crop);});
  });

  // keep the marquee in sync with the current crop/all view
  var mk=document.getElementById("QW4K2-marquee-ticker");
  if(mk) mk.textContent=buildTicker();
}

function selectCrop(c){
  currentCrop=c;
  render();
  // dismissed for good the first time the user picks a crop from either
  // panel — no need to keep nudging them once they've found it
  document.querySelectorAll(".QW4K2-crop-hint").forEach(function(h){ h.style.display="none"; });
}

function buildSidebar(){
  var ul=document.getElementById("QW4K2-commodity-list"); ul.innerHTML="";
  var items=[ALL].concat(commodityOrder);
  items.forEach(function(c){
    var li=document.createElement("li"); li.className="QW4K2-before-marker";
    var b=document.createElement("button"); b.dataset.crop=c;
    if(c===ALL) li.classList.add("QW4K2-all-item");
    b.innerHTML="<span class='QW4K2-clabel'>"+cropLabel(c)+"</span>";
    b.addEventListener("click",function(){selectCrop(c);});
    li.appendChild(b); ul.appendChild(li);
  });
}

function applyLang(){
  var d=dict[lang];
  document.getElementById("QW4K2-win-title").textContent=d.title;
  document.getElementById("QW4K2-brand-title").textContent=d.brand;
  document.getElementById("QW4K2-side-title").textContent=d.admin;
  document.getElementById("QW4K2-state-label").textContent=d.stateLbl;
  document.getElementById("QW4K2-side-code").textContent=d.code;
  // sidebar crop labels
  document.querySelectorAll("#QW4K2-commodity-list button").forEach(function(b){
    var lbl=b.querySelector(".QW4K2-clabel"); if(lbl) lbl.textContent=cropLabel(b.dataset.crop);
  });
  document.getElementById("QW4K2-side-note").textContent=(lang==="hi"
    ? "रंग मान दर्शाता है — गहरा हरा = अधिक। जिले पर क्लिक करें।"
    : "Colour shows the value — darker green = higher. Click a district for detail.");
  document.getElementById("QW4K2-marquee-ticker").textContent=buildTicker();
}

// Build the marquee text from real data: district – crop – modal price.
// For a selected crop, list its markets; for ALL, one representative row per district.
function buildTicker(){
  var rows;
  if(currentCrop===ALL){
    var seen={}; rows=[];
    RAW.forEach(function(r){ if(!seen[r.district]){ seen[r.district]=1; rows.push(r); } });
  } else {
    rows=(byCommodity[currentCrop]||[]).slice();
  }
  var parts=rows.map(function(r){
    var who = currentCrop===ALL ? distLabel(r.district)
                                : distLabel(r.district)+" ("+cropLabel(r.commodity)+")";
    return who+" — "+fmt(r.modal);
  });
  // hint leads, then alternates with the real data (hint, real, hint,
  // real, ...) so it's the very first thing shown and keeps resurfacing
  // as the ticker loops
  var withHint=[];
  parts.forEach(function(p){
    withHint.push("Click the map to interact", p);
  });
  // repeat once so the loop reads continuously without a long gap
  var line=withHint.join("   •   ");
  return line+"   •   "+line;
}

function toggleLanguage(){ lang=document.getElementById("QW4K2-langToggle").value; applyLang(); render(); }

// legend control on the map
var legend=L.control({position:"bottomleft"});
legend.onAdd=function(){
  var div=L.DomUtil.create("div","QW4K2-map-legend");
  div.innerHTML="<div id='QW4K2-leg-body'></div>";
  return div;
};
legend.addTo(map);
function refreshLegend(){
  var d=dict[lang];
  var isAll=(currentCrop===ALL);
  var head = isAll ? (lang==="hi"?"फसलों की संख्या":"No. of commodities")
                   : (lang==="hi"?"मंडी भाव (Rs./kg)":"Mandi price (Rs./kg)");
  var none  = isAll ? d.nrec : d.norate;

  var rampRows;
  if(isAll && lastLo!==null && lastHi!==null){
    // real district crop counts, not vague "fewer/more" labels — mirrors
    // the 3-stop gradient in rampColor() (low/mid/high)
    var mid=Math.round((lastLo+lastHi)/2);
    var cropWord=function(n){ return lang==="hi" ? "फसलें" : pluralize(n,"crop","crops"); };
    var loTxt=localizeNum(lastLo)+" "+cropWord(lastLo);
    var midTxt=localizeNum(mid)+" "+cropWord(mid);
    var hiTxt=localizeNum(lastHi)+"+ "+cropWord(lastHi);
    rampRows=
      "<div><span class='QW4K2-sw' style='background:rgb(0,102,0)'></span>"+hiTxt+"</div>"+
      "<div><span class='QW4K2-sw' style='background:rgb(179,162,93)'></span>"+midTxt+"</div>"+
      "<div><span class='QW4K2-sw' style='background:rgb(238,221,171)'></span>"+loTxt+"</div>";
  } else {
    rampRows=
      "<div><span class='QW4K2-sw' style='background:rgb(0,102,0)'></span>"+d.high+"</div>"+
      "<div><span class='QW4K2-sw' style='background:rgb(238,221,171)'></span>"+d.low+"</div>";
  }

  document.getElementById("QW4K2-leg-body").innerHTML=
    "<div style='margin-bottom:3px'>"+head+"</div>"+
    rampRows+
    "<div><span class='QW4K2-sw' style='background:#f3f0e0'></span>"+none+"</div>";
}
var _origRender=render;
render=function(){ _origRender(); refreshLegend(); };

// language select now wires up here instead of an inline onchange= attribute
document.getElementById("QW4K2-langToggle").addEventListener("change", toggleLanguage);

buildSidebar();
applyLang();
render();
// ensure the map fills the fixed-height frame after layout settles
setTimeout(function(){ map.invalidateSize(); if(mpBounds) map.fitBounds(mpBounds,{padding:[12,12]}); },80);
window.addEventListener("resize",function(){ map.invalidateSize(); });

});
  </script>
</body>
</html>
