<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Timeline & Gallery</title>
  
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    h1.title {
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    /* Chart Wrapper */
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      background-color: #efefef;
      border-radius: 4px;
    }

    #chart-container {
      width: 100%;
      height: 100%;
    }

    /* Floating Contextual Tooltip */
    .custom-tooltip {
      position: absolute;
      width: 230px;
      background: #e8e8e8;
      border: 1px solid #1d1d1f;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      pointer-events: none;
      opacity: 0;
      z-index: 1000;
      transition: opacity 0.3s ease;
      font-size: 11px;
      line-height: 1.4;
      color: #1d1d1f;
    }

    .custom-tooltip.active {
      opacity: 1;
    }

    .custom-tooltip h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 2px;
      color: #000;
    }

    .custom-tooltip .subtitle {
      color: #6e6e73;
      font-size: 10px;
      margin-bottom: 12px;
    }

    .custom-tooltip .divider {
      height: 1px;
      background-color: #1d1d1f;
      margin: 10px 0;
    }

    .custom-tooltip .date {
      font-family: monospace;
      margin-bottom: 6px;
      color: #1d1d1f;
    }

    .custom-tooltip .org {
      margin-bottom: 6px;
      font-weight: 500;
    }

    .custom-tooltip .stack {
      color: #515154;
      font-size: 10px;
      line-height: 1.3;
    }

    /* Category Controls with Legend Dots */
    .filter-nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 30px 0 50px 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: none;
      font-size: 14px;
      color: #86868b;
      cursor: pointer;
      padding: 4px 8px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .filter-btn:hover {
      color: #1d1d1f;
    }

    .filter-btn.active {
      color: #1d1d1f;
      font-weight: 600;
      border-bottom: 2px solid #1d1d1f;
    }

    /* Gallery Frame */
    .gallery-wrapper {
      position: relative;
      width: 100%;
      min-height: 380px;
      overflow: hidden;
      display: flex;
    }

    .gallery-track {
      display: flex;
      align-items: flex-start;
      position: relative;
      width: 100%;
      will-change: transform;
    }

    .card {
      flex: 0 0 20%;
      margin-right: -7%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 1; /* 100% opacity maintained on card element */
      position: relative;
      z-index: 1;
      pointer-events: none;
      will-change: transform, filter;
      filter: grayscale(100%);
      transition: filter 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .card.hidden {
      display: none !important;
    }

    /* Image Box with Semi-Transparent White Overlay */
    .card-image-box {
      position: relative;
      width: 100%;
      height: 180px;
      background-color: #d1d1d6;
      border: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      border-radius: 3px;
    }

    /* White Fading Layer over Image */
    .card-image-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      opacity: 0.45; /* Soft white overlay to fade default state */
      transition: opacity 0.65s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    .card-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1; /* 100% opacity maintained on image element */
    }

    .card-info {
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.4s ease;
      font-size: 13px;
      text-align: left;
    }

    .card-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d1f;
    }

    /* Active Highlighted Card State */
    .card.active {
      z-index: 100 !important;
      filter: grayscale(0%);
    }

    /* Remove the white overlay when highlighted */
    .card.active .card-image-box::after {
      opacity: 0;
    }

    .card.active .card-info {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Archive</h1>
    
    <div class="chart-wrapper" id="chart-wrapper">
      <div id="chart-container"></div>
      
      <div class="custom-tooltip" id="custom-tooltip">
        <h2 id="tt-title">Project Title</h2>
        <div class="subtitle" id="tt-sub">Category Details</div>
        <div class="divider"></div>
        <div class="date" id="tt-date">20/08/2026</div>
        <div class="org" id="tt-org">The-Ken / Intermission</div>
        <div class="stack" id="tt-stack">HTML, Javascript, ECharts, GSAP</div>
      </div>
    </div>

    <!-- Category Filter Navigation -->
    <div class="filter-nav" id="filter-nav">
      <button class="filter-btn active" data-category="All">
        <span class="dot" style="background-color: #1d1d1f;"></span>All
      </button>
      <button class="filter-btn" data-category="Visual Journalism">
        <span class="dot" style="background-color: #e05d5d;"></span>Visual Journalism
      </button>
      <button class="filter-btn" data-category="Graphic Design">
        <span class="dot" style="background-color: #2b9348;"></span>Graphic Design
      </button>
      <button class="filter-btn" data-category="Game Design">
        <span class="dot" style="background-color: #e3a008;"></span>Game Design
      </button>
      <button class="filter-btn" data-category="Web Development">
        <span class="dot" style="background-color: #3182ce;"></span>Web Development
      </button>
      <button class="filter-btn" data-category="UX Design">
        <span class="dot" style="background-color: #805ad5;"></span>UX Design
      </button>
    </div>

    <!-- Gallery Viewport -->
    <div class="gallery-wrapper" id="gallery-wrapper">
      <div class="gallery-track" id="gallery-track"></div>
    </div>
  </div>

  <script>
    const categories = [
      'Visual Journalism', 
      'Graphic Design', 
      'Game Design', 
      'Web Development', 
      'UX Design'
    ];

    const categoryColors = {
      'Visual Journalism': '#e05d5d',
      'Graphic Design': '#2b9348',
      'Game Design': '#e3a008',
      'Web Development': '#3182ce',
      'UX Design': '#805ad5'
    };

    const MIN_TIME = new Date(2006, 0, 1).getTime();
    const MAX_TIME = new Date(2016, 11, 31).getTime();

    const projects = [];

    function getFallbackImage(text) {
      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="%23d1d1d6"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="20" fill="%236e6e73">${encodeURIComponent(text)}</text></svg>`;
    }

    for (let i = 0; i < 25; i++) {
      const randomTimestamp = MIN_TIME + Math.random() * (MAX_TIME - MIN_TIME);
      const dateObj = new Date(randomTimestamp);
      const formattedDate = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
      const category = categories[i % categories.length];
      const impact = parseFloat((Math.random() * 8 + 2).toFixed(1));

      projects.push({
        id: i,
        name: `${i + 1} ${category.split(' ')[0]}`,
        subtitle: `Project Scope - ${category}`,
        dateStr: formattedDate,
        timestamp: randomTimestamp,
        category: category,
        impact: impact,
        org: 'The-Ken / Intermission',
        stack: 'HTML, Javascript, ECharts, GSAP',
        image: `https://picsum.photos/seed/${i + 180}/400/300`,
        color: categoryColors[category]
      });
    }

    projects.sort((a, b) => a.timestamp - b.timestamp);

    const galleryTrack = document.getElementById('gallery-track');
    const galleryWrapper = document.getElementById('gallery-wrapper');
    
    projects.forEach((proj, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = proj.id;
      card.dataset.category = proj.category;
      card.style.zIndex = idx + 1;

      card.innerHTML = `
        <div class="card-image-box">
          <img src="${proj.image}" alt="${proj.name}" onerror="this.onerror=null; this.src='${getFallbackImage(proj.name)}';" />
        </div>
        <div class="card-info">
          <h3>${proj.name}</h3>
        </div>
      `;
      galleryTrack.appendChild(card);
    });

    const chartWrapper = document.getElementById('chart-wrapper');
    const chartDom = document.getElementById('chart-container');
    const myChart = echarts.init(chartDom);
    const tooltipNode = document.getElementById('custom-tooltip');

    function prepareSeriesData(filteredData) {
      const sortedByImpact = [...filteredData].sort((a, b) => b.impact - a.impact);
      
      return sortedByImpact.map(p => ({
        name: p.name,
        value: [p.timestamp, 0, p.impact, p.category, p.id],
        projectData: p,
        itemStyle: {
          color: p.color,
          opacity: 0.6
        }
      }));
    }

    const option = {
      tooltip: { show: false },
      grid: {
        left: '5%',
        right: '5%',
        top: '10%',
        bottom: '10%'
      },
      xAxis: {
        type: 'time',
        min: MIN_TIME,
        max: MAX_TIME,
        splitLine: { show: false },
        axisLine: { 
          onZero: true,
          lineStyle: { color: '#1d1d1f', width: 1.5 } 
        },
        axisLabel: { 
          color: '#1d1d1f',
          formatter: '{yyyy}',
          verticalAlign: 'middle',
          margin: -16,
          fontSize: 11,
          fontWeight: 'bold'
        },
        axisTick: { 
          alignWithLabel: true,
          length: 10,
          inside: true,
          lineStyle: { color: '#1d1d1f', width: 1.5 }
        }
      },
      yAxis: {
        type: 'value',
        min: -10,
        max: 10,
        show: false
      },
      series: [{
        type: 'scatter',
        symbolSize: function (data) {
          return data[2] * 7;
        },
        data: prepareSeriesData(projects),
        animationDuration: 400,
        emphasis: {
          scale: 1.12,
          itemStyle: {
            opacity: 0.6,
            shadowBlur: 8,
            shadowColor: 'rgba(0,0,0,0.15)'
          }
        }
      }]
    };

    myChart.setOption(option);

    chartWrapper.addEventListener('mousemove', (e) => {
      const bounds = chartWrapper.getBoundingClientRect();
      const mouseX = e.clientX - bounds.left;
      const mouseY = e.clientY - bounds.top;

      let targetLeft = mouseX - 115; 
      let targetTop = mouseY + 18;  

      if (targetLeft < 10) targetLeft = 10;
      if (targetLeft + 235 > bounds.width) targetLeft = bounds.width - 245;

      tooltipNode.style.left = `${targetLeft}px`;
      tooltipNode.style.top = `${targetTop}px`;
    });

    function updateFrameVisibility() {
      const wrapperBounds = galleryWrapper.getBoundingClientRect();
      const cards = document.querySelectorAll('.card:not(.hidden)');

      cards.forEach(card => {
        const cardBounds = card.getBoundingClientRect();
        if (cardBounds.right < wrapperBounds.left - 20 || cardBounds.left > wrapperBounds.right + 20) {
          card.style.visibility = 'hidden';
        } else {
          card.style.visibility = 'visible';
        }
      });
    }

    const GAP_OFFSET = 120; 

    function updateTooltipContent(proj) {
      document.getElementById('tt-title').innerText = proj.name;
      document.getElementById('tt-sub').innerText = proj.subtitle;
      document.getElementById('tt-date').innerText = proj.dateStr;
      document.getElementById('tt-org').innerText = proj.org;
      document.getElementById('tt-stack').innerText = proj.stack;
    }

    function focusCard(id) {
      const cards = Array.from(document.querySelectorAll('.card:not(.hidden)'));
      const targetIndex = cards.findIndex(c => parseInt(c.dataset.id) === id);
      const targetCard = cards[targetIndex];

      if (!targetCard) return;

      cards.forEach((c, idx) => {
        if (idx === targetIndex) {
          c.classList.add('active');
          gsap.to(c, { scale: 1.06, x: 0, duration: 0.65, ease: 'power2.out', overwrite: 'auto' });
        } else if (idx < targetIndex) {
          c.classList.remove('active');
          gsap.to(c, { scale: 0.95, x: -GAP_OFFSET, duration: 0.65, ease: 'power2.out', overwrite: 'auto' });
        } else {
          c.classList.remove('active');
          gsap.to(c, { scale: 0.95, x: GAP_OFFSET, duration: 0.65, ease: 'power2.out', overwrite: 'auto' });
        }
      });

      const cardOffset = targetCard.offsetLeft + (targetCard.offsetWidth / 2);
      const containerWidth = galleryWrapper.offsetWidth;
      const targetX = (containerWidth / 2) - cardOffset;

      gsap.to(galleryTrack, {
        x: targetX,
        duration: 0.65,
        ease: 'power2.out',
        overwrite: 'auto',
        onUpdate: updateFrameVisibility,
        onComplete: updateFrameVisibility
      });

      tooltipNode.classList.add('active');
    }

    function resetGallery() {
      const cards = document.querySelectorAll('.card:not(.hidden)');
      cards.forEach(c => {
        c.classList.remove('active');
        gsap.to(c, { scale: 1, x: 0, duration: 0.65, ease: 'power2.out', overwrite: 'auto' });
      });

      gsap.to(galleryTrack, {
        x: 0,
        duration: 0.65,
        ease: 'power2.out',
        overwrite: 'auto',
        onUpdate: updateFrameVisibility,
        onComplete: updateFrameVisibility
      });

      tooltipNode.classList.remove('active');
    }

    myChart.on('mouseover', 'series', function (params) {
      const proj = params.data.projectData;
      updateTooltipContent(proj);
      focusCard(proj.id);
    });

    myChart.on('mouseout', 'series', function() {
      resetGallery();
    });

    let selectedCategories = new Set(['All']);
    const filterButtons = document.querySelectorAll('.filter-btn');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.category;

        if (cat === 'All') {
          selectedCategories.clear();
          selectedCategories.add('All');
        } else {
          selectedCategories.delete('All');
          if (selectedCategories.has(cat)) {
            selectedCategories.delete(cat);
            if (selectedCategories.size === 0) selectedCategories.add('All');
          } else {
            selectedCategories.add(cat);
          }
        }

        filterButtons.forEach(b => {
          if (selectedCategories.has(b.dataset.category)) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });

        const activeProjects = projects.filter(p => 
          selectedCategories.has('All') || selectedCategories.has(p.category)
        );

        myChart.setOption({
          series: [{
            data: prepareSeriesData(activeProjects)
          }]
        });

        document.querySelectorAll('.card').forEach(card => {
          if (selectedCategories.has('All') || selectedCategories.has(card.dataset.category)) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });

        resetGallery();
      });
    });

    updateFrameVisibility();

    window.addEventListener('resize', () => {
      myChart.resize();
      resetGallery();
    });
  </script>
</body>
</html>
